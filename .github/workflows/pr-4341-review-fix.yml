name: PR 4341 review fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-4341-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'canblmz1/dyad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stream-safety-gate-before-apply
          fetch-depth: 0

      - name: Apply narrow review fixes
        shell: python
        run: |
          from pathlib import Path

          handler_path = Path("src/ipc/handlers/chat_stream_handlers.ts")
          handler = handler_path.read_bytes()
          old_handler = b'''        fullResponse = await streamTestResponse(\n          event,\n          req.chatId,\n          req.invocationRef,\n          req.streamId,\n          testResponse,\n          abortController,\n          placeholderAssistantMessage.id,\n        );\n      } else {'''
          new_handler = b'''        fullResponse = await streamTestResponse(\n          event,\n          req.chatId,\n          req.invocationRef,\n          req.streamId,\n          testResponse,\n          abortController,\n          placeholderAssistantMessage.id,\n        );\n        if (!abortController.signal.aborted) {\n          // Canned QA responses are deterministic local fixtures and do not\n          // have a provider finish reason to observe. Successful completion\n          // explicitly preserves their existing auto-apply behavior, while\n          // aborted fixtures remain blocked by the outer abort gate below.\n          accumulatedStreamSafety = { confirmedSafe: true };\n        }\n      } else {'''
          if handler.count(old_handler) != 1:
              raise SystemExit("expected canned QA handler context exactly once")
          handler_path.write_bytes(handler.replace(old_handler, new_handler, 1))

          test_path = Path("src/ipc/handlers/chat_stream_handlers.test.ts")
          test = test_path.read_bytes()
          old_comment = b"(`if (shouldAutoApply && !hasDestructiveSql && lastStreamSafety.confirmedSafe)`),"
          new_comment = b"(`if (shouldAutoApply && !hasDestructiveSql && accumulatedStreamSafety.confirmedSafe)`),"
          if test.count(old_comment) != 1:
              raise SystemExit("expected stale gate comment exactly once")
          test_path.write_bytes(test.replace(old_comment, new_comment, 1))

      - name: Validate exact diff shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "src/ipc/handlers/chat_stream_handlers.test.ts" -o "${files[0]}" = "src/ipc/handlers/chat_stream_handlers.ts"
          test "${files[1]}" = "src/ipc/handlers/chat_stream_handlers.test.ts" -o "${files[1]}" = "src/ipc/handlers/chat_stream_handlers.ts"
          test "${files[0]}" != "${files[1]}"
          git diff --numstat | grep -Fx $'7\t0\tsrc/ipc/handlers/chat_stream_handlers.ts'
          git diff --numstat | grep -Fx $'1\t1\tsrc/ipc/handlers/chat_stream_handlers.test.ts'
          git diff -- src/ipc/handlers/chat_stream_handlers.ts src/ipc/handlers/chat_stream_handlers.test.ts

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "canblmz1"
          git config user.email "116688414+canblmz1@users.noreply.github.com"
          git add -- src/ipc/handlers/chat_stream_handlers.ts src/ipc/handlers/chat_stream_handlers.test.ts
          git commit -m "fix: preserve canned QA auto-apply"
          git push origin HEAD:fix/stream-safety-gate-before-apply
